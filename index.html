const info=t=>`<section class="pg"><h1>${t}</h1><p>Placeholder copy. This is a demo store: checkout is simulated and no payment is taken.</p><a class="btn" href="#shop">Back to shop</a></section>`;
const foot=()=>`<footer><div class="ln"></div><div class="fh"><p class="big">Your Style. Your Time.<br><span>Your Flex.</span></p><div class="c26" aria-hidden="true">©26</div></div><p class="fp">Explore the collection. Find your favourite. Make it yours.</p><div class="ln1"></div><div class="fb"><div><b>Watch Flex PK</b><br>All rights reserved © 2026</div><div>Libertad 2529<br>Office 102<br>Montevideo, Uruguay</div><a href="#privacy">Privacy Policy</a><div>Dribbble<br>Instagram<br>LinkedIn<br>Twitter (X)</div><div>Work<br>Services<br>About<br>Careers</div><a href="https://wa.me/${WA}" target="_blank" rel="noopener">Let’s talk</a></div></footer>`;
function fitAll(){$$a('.fit').forEach(el=>{el.style.fontSize='100px';const w=el.parentElement.clientWidth;const f=100*w/el.getBoundingClientRect().width;el.style.fontSize=f+'px';if(el.closest('.sub'))el.parentElement.style.lineHeight='.92'})}

/* ---------- smooth scroll (Lenis) + GSAP ---------- */
gsap.registerPlugin(ScrollTrigger);
const lenis=new Lenis({duration:1.25,easing:t=>Math.min(1,1.001-Math.pow(2,-10*t)),smoothWheel:true});
lenis.on('scroll',ScrollTrigger.update);
gsap.ticker.add(t=>lenis.raf(t*1000));gsap.ticker.lagSmoothing(0);

let pal=null;
function anim(first){
  ScrollTrigger.getAll().forEach(s=>s.kill());if(pal){pal.kill();pal=null}
  const fine=matchMedia('(hover:hover)').matches;
  if(!RM){
    // parallax: image drifts inside its frame while the tile crosses the viewport
    $$a('.tile .im:not(.alt) > img, .pd .im > img').forEach(img=>{
      gsap.fromTo(img,{yPercent:-5},{yPercent:5,ease:'none',scrollTrigger:{trigger:img.parentElement,start:'top bottom',end:'bottom top',scrub:true}})});
    // tile reveal: frame wipes open from the bottom, image settles from a slight zoom
    $$a('.tile .im,.pd .im').forEach(el=>{
      gsap.fromTo(el,{clipPath:'inset(100% 0 0 0)'},{clipPath:'inset(0% 0 0 0)',duration:1.1,ease:'power4.out',scrollTrigger:{trigger:el,start:'top 92%',once:true}});
      gsap.from(el.querySelector('img'),{scale:1.25,duration:1.6,ease:'power3.out',scrollTrigger:{trigger:el,start:'top 92%',once:true}})});
    $$a('.tile .meta,.tile .cat').forEach(el=>gsap.from(el,{opacity:0,y:14,duration:.8,ease:'power3.out',scrollTrigger:{trigger:el,start:'top 98%',once:true}}));
    gsap.from('.rule',{scaleX:0,duration:1.2,ease:'power4.inOut'});
    gsap.from('.wm .ch',{yPercent:112,duration:1.2,ease:'power4.out',delay:first?0:.05});
    gsap.from('.sub .fit',{yPercent:30,opacity:0,duration:.9,ease:'power3.out',delay:.3});
    gsap.from('.big,.c26',{yPercent:20,opacity:0,duration:1,ease:'power3.out',scrollTrigger:{trigger:'footer',start:'top 80%',once:true}});
    const pe=$('.pal');if(pe){const W=innerWidth,tl=gsap.timeline({repeat:-1,yoyo:true});
      tl.fromTo(pe,{x:W*.04,y:0,rotate:-6},{x:W*.48,y:W*.14,rotate:6,duration:7,ease:'sine.inOut'}).to(pe,{x:W*.84,y:W*.02,rotate:-4,duration:7,ease:'sine.inOut'});pal=tl}
  }
  // hover: navy wipe reveal + "View more" bubble that follows the cursor
  if(fine)$$a('.tile .im').forEach(el=>{
    const alt=el.querySelector('.alt'),v=el.querySelector('.view');if(!alt)return;
    const qx=gsap.quickTo(v,'x',{duration:.45,ease:'power3'}),qy=gsap.quickTo(v,'y',{duration:.45,ease:'power3'});
    el.addEventListener('mouseenter',e=>{const r=el.getBoundingClientRect();gsap.set(v,{x:e.clientX-r.left,y:e.clientY-r.top});
      gsap.killTweensOf(alt);gsap.fromTo(alt,{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',duration:.55,ease:'power4.out'});
      gsap.to(v,{scale:1,duration:.5,ease:'back.out(1.8)'})});
    el.addEventListener('mousemove',e=>{const r=el.getBoundingClientRect();qx(e.clientX-r.left);qy(e.clientY-r.top)});
    el.addEventListener('mouseleave',()=>{gsap.killTweensOf(alt);gsap.to(alt,{clipPath:'inset(0 0 0 100%)',duration:.5,ease:'power4.inOut'});gsap.to(v,{scale:0,duration:.3,ease:'power2.in'})})});
  ScrollTrigger.refresh();
}
function route(keep,first){const h=location.hash.slice(1)||'shop',p=P.find(x=>'p-'+x[0]===h);
$('#app').innerHTML=(h==='bag'?bag():p?prod(p):h==='shipping'?info('Shipping &amp; returns'):h==='privacy'?info('Privacy policy'):shop())+foot();
$$a('nav a').forEach(a=>a.dataset.k===(h==='bag'?'bag':'shop')?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
if(h!=='bag')note='';if(keep!==true)lenis.scrollTo(0,{immediate:true,force:true});fitAll();anim(first)}

/* page transition: navy panel wipes up, swaps the page, keeps going */
let busy=false;
function go(h){if(busy||('#'+(location.hash.slice(1)||'shop'))===h)return;
  if(RM){location.hash=h;return}busy=true;lenis.stop();
  gsap.timeline({onComplete:()=>{busy=false;lenis.start()}})
   .set('#tr',{yPercent:0,y:'100%'}).to('#tr',{y:'0%',duration:.7,ease:'power4.inOut'})
   .add(()=>{location.hash=h})
   .to('#tr',{y:'-100%',duration:.7,ease:'power4.inOut',delay:.15})}
document.addEventListener('click',e=>{
const d=e.target.closest('.dot');if(d)return theme(d.dataset.t);
const a=e.target.closest('a[href^="#"]');if(a&&!e.metaKey&&!e.ctrlKey){e.preventDefault();return go(a.getAttribute('href'))}
const b=e.target.closest('[data-a]');if(!b)return;const k=b.dataset.a,id=b.dataset.id;
if(k==='add'){cart[id]=(cart[id]||0)+1;save();b.textContent='Added — add another';return}
if(k==='inc')cart[id]++;if(k==='dec'&&--cart[id]<1)delete cart[id];if(k==='rm')delete cart[id];
if(k==='buy'){cart={};note='Simulated checkout done.<br>No payment taken.'}
save();route(true)});
addEventListener('hashchange',()=>route());
addEventListener('resize',()=>{fitAll();ScrollTrigger.refresh()});

/* navy dot cursor */
if(matchMedia('(hover:hover)').matches){const c=$('#cur'),cx=gsap.quickTo(c,'x',{duration:.18,ease:'power3'}),cy=gsap.quickTo(c,'y',{duration:.18,ease:'power3'});addEventListener('mousemove',e=>{cx(e.clientX);cy(e.clientY)})}

/* intro: letters rise, photo cards stack up while the counter runs, curtain lifts */
function intro(done){
  const it=$('#intro');if(RM){it.remove();return done()}
  $('#iw').innerHTML=[...'WATCH FLEX'].map(c=>`<span class="ch">${c===' '?'&nbsp;':c}</span>`).join('')+'<sup>®</sup>';
  lenis.stop();
  const order=['reddot','hw2','neutral','white','mono','kerned','spec','off','cmdk','pos'],cards=$('#cards'),o={n:0};let made=0;
  const add=()=>{const im=new Image();im.src=IMG[order[made%order.length]];cards.appendChild(im);made++;
    gsap.fromTo(im,{scale:.55,opacity:0,rotate:gsap.utils.random(-18,18),y:30},{scale:1,opacity:1,rotate:gsap.utils.random(-9,9),y:0,duration:.45,ease:'back.out(1.6)'})};
  gsap.set('.iw .ch',{yPercent:115});
  const tl=gsap.timeline({onComplete:()=>{it.remove();lenis.start();done&&done()}});
  tl.to('.iw .ch',{yPercent:0,duration:.9,ease:'power4.out',stagger:.07})
    .to(o,{n:100,duration:2.6,ease:'power2.inOut',onUpdate:()=>{const n=Math.round(o.n);$('#ic').textContent=String(n).padStart(3,'0');while(made<Math.min(10,Math.floor(n/9)+1))add()}},0)
    .to('#cards img',{y:-60,opacity:0,rotate:'+=8',duration:.5,ease:'power3.in',stagger:.03},'>+.1')
    .to('.iw .ch',{yPercent:-115,duration:.6,ease:'power3.in',stagger:.04},'<')
    .to('#intro',{yPercent:-100,duration:1,ease:'power4.inOut'},'>-.05')
    .add(()=>route(true,true),'<+.15');
}
save();
// render page once fonts are ready so the wordmark fits correctly
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{if(RM){route(false,true);$('#intro')&&$('#intro').remove()}else{window.scrollTo(0,0);intro()}});
</script></body></html>
