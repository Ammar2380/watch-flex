.th{display:flex;gap:8px;margin-top:8px}.th button{width:64px;aspect-ratio:1;border:1px solid currentColor;padding:0;background:none;cursor:pointer;overflow:hidden}.th img{width:100%;height:100%;object-fit:cover;display:block}
.pd .price{font-size:clamp(18px,1.8vw,36px);font-weight:700}.pd dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:clamp(13px,1vw,18px)}.pd dt{opacity:.6}.pd dd{margin:0}
.sp{margin:0;padding-left:1.1em;font-size:clamp(13px,1vw,18px)}.st{font-weight:600}
.lp small,.sumr small,.ln2 small{font-weight:500;font-size:12px;opacity:.7}
.chip{min-height:36px}.cta[disabled]{opacity:.45;cursor:not-allowed}
.tb{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tb input,.tb select,.pr input{font:inherit;font-size:max(16px,1vw);color:inherit;background:transparent;border:1px solid currentColor;border-radius:99px;padding:10px 18px;min-height:44px}
.tb select option{color:#000}.tb input[type=search]{flex:1 1 280px;min-width:0}
input::placeholder{color:inherit;opacity:.55}
.fpnl{display:grid;grid-template-columns:2fr 1.2fr 1.6fr;gap:20px var(--pad);padding:16px 0 28px;border-top:1px solid color-mix(in srgb,var(--fg) 22%,transparent)}
.fg{display:flex;flex-direction:column;gap:10px;min-width:0}.bs{max-height:9.5em;overflow:auto}
.pr{display:flex;align-items:center;gap:8px}.pr input{width:100%;min-width:0;border-radius:12px}.fg small{opacity:.8;min-height:1em}
#cl{grid-column:1/-1;justify-self:start}
.rc{margin:0;font-weight:600;font-size:clamp(12px,.95vw,18px)}
.em{text-align:center;padding:clamp(40px,7vw,110px) 0;display:flex;flex-direction:column;align-items:center;gap:12px}.em:not([hidden]){display:flex}.em b{font-size:clamp(20px,2vw,36px)}.em p{margin:0;max-width:44ch}
.more{display:flex;justify-content:center;padding-top:clamp(24px,4vw,64px)}
.tgl{display:none}
@media(max-width:900px){.pd .gal{position:relative;top:0;max-width:620px}.fpnl{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.tgl{display:inline-flex;align-items:center}.fpnl{display:none;grid-template-columns:1fr}.fpnl.open{display:grid}.tb select{flex:1 1 140px}}
@media(pointer:coarse){.dots{gap:12px}}

<script>
/* =====================================================================
   CATALOGUE DATA — add real inventory here (100–300 products supported).
   Fields: id (unique, URL-safe), name, brand, model (exact), price (PKR number),
   images [urls you have rights to], category, specs [strings], stock 'in'|'out'|'unknown',
   featured (true only if genuinely featured), isNew (true only if genuinely new).
   Records without id/name/positive price, or with a duplicate id, are skipped (see console).
   ===================================================================== */
/*DATA_START*/
const RAW=[
{id:'f-seiko-presage',name:'Seiko Presage',brand:'Seiko',model:'',price:64999,images:['https://images.unsplash.com/photo-1434056886845-dac89ffe9b56?auto=format&fit=crop&w=1800&q=90'],category:'Watches',specs:['Automatic','Blue Dial'],stock:'unknown',featured:false,isNew:false},
{id:'f-casio-enticer',name:'Casio Enticer',brand:'Casio',model:'',price:32999,images:['https://images.unsplash.com/photo-1614164185128-e4ec99c436d7?auto=format&fit=crop&w=1800&q=90'],category:'Watches',specs:['Analog','Leather Strap'],stock:'unknown',featured:false,isNew:false},
{id:'f-citizen-eco-drive',name:'Citizen Eco-Drive',brand:'Citizen',model:'',price:89999,images:['https://images.unsplash.com/photo-1522312346375-d1a52e2b99b3?auto=format&fit=crop&w=1800&q=90'],category:'Watches',specs:['Solar','Stainless Steel'],stock:'unknown',featured:false,isNew:false},
{id:'f-tissot-gentleman',name:'Tissot Gentleman',brand:'Tissot',model:'',price:144999,images:['https://images.unsplash.com/photo-1523170335258-f5ed11844a49?auto=format&fit=crop&w=1800&q=90'],category:'Watches',specs:['Automatic','Sapphire Glass'],stock:'unknown',featured:false,isNew:false}
];
/*DATA_END*/
const REV=[]; // customer reviews: add only real, permitted reviews as [name, city, text]. The section hides while empty.
const DECOR='https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=85';
const WA='923123802930',IG='https://www.instagram.com/watchflex.pk/',STEP=16;
const PHW='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><rect width="400" height="500" fill="#1a1d24"/><rect x="165" y="0" width="70" height="500" fill="#8f9ab3" opacity=".35"/><circle cx="200" cy="250" r="110" fill="#8f9ab3"/><circle cx="200" cy="250" r="96" fill="#0a1f44"/><path d="M200 250V192M200 250l36 20" stroke="#ebe5dd" stroke-width="5" stroke-linecap="round"/><circle cx="200" cy="250" r="6" fill="#ebe5dd"/></svg>');
const WAI='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1-1.5-.7-2.5-1.3-3.5-2.9-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.3.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.2.7 3 .6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>';
const ico={
q:'<svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M9 3l3 6 3-6M12 21 9 9m3 12 3-12"/></svg>',
c:'<svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9 8 11 4.6-2 8-6 8-11V5z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
d:'<svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2 6h12v10H2zM14 9h4l4 3v4h-8"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
s:'<svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/><path d="M19 20c0 1.5-2 2-5 2"/></svg>'};

const $=s=>document.querySelector(s),$$a=s=>[...document.querySelectorAll(s)];
const sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},ld=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pkr=n=>'PKR '+Math.round(n).toLocaleString('en-US');
const sm=u=>u.replace('w=1800','w=900').replace('q=90','q=80');
const say=t=>{const s=$('#st');if(s)s.textContent=t};

/* ---- catalogue model ---- */
const MAP=new Map(),ITEMS=[];
RAW.forEach((r,i)=>{if(!r||!r.id||!r.name||!(+r.price>0)||MAP.has(r.id)){console.warn('Skipped product record:',r&&r.id);return}
  const p={...r,price:+r.price,brand:r.brand||'',model:r.model||'',category:r.category||'Watches',images:(r.images||[]).filter(Boolean),specs:r.specs||[],stock:r.stock||'unknown',ord:i};
  p.hay=[p.name,p.brand,p.model,p.category,...p.specs].join(' ').toLowerCase();MAP.set(p.id,p);ITEMS.push(p)});
const S={q:'',brands:new Set(),min:'',max:'',sort:'featured',shown:STEP};
function view(){const t=S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);let lo=Math.max(0,+S.min||0),hi=S.max===''?Infinity:Math.max(0,+S.max||0);if(lo>hi)[lo,hi]=[hi,lo];
  const nm=(x,y)=>x.name.localeCompare(y.name),o=S.sort;
  return ITEMS.filter(p=>t.every(w=>p.hay.includes(w))&&(!S.brands.size||S.brands.has(p.brand))&&p.price>=lo&&p.price<=hi)
   .sort(o==='low'?(x,y)=>x.price-y.price||nm(x,y):o==='high'?(x,y)=>y.price-x.price||nm(x,y):o==='name'?nm:(x,y)=>(!!y.featured-!!x.featured)||x.ord-y.ord)}
// budget ranges come from the real price spread (up to 4 ranges, rounded to a sensible step)
function budgets(){const pr=ITEMS.map(p=>p.price).sort((a,b)=>a-b);if(pr.length<2||pr[0]===pr[pr.length-1])return[];
  const mn=pr[0],mx=pr[pr.length-1],k=Math.min(4,new Set(pr).size),step=[500,1000,2500,5000,10000,25000,50000,100000,250000].find(s=>s>=(mx-mn)/(k*3))||250000;
  const br=[...new Set([...Array(k-1)].map((_,i)=>Math.round(pr[Math.floor(pr.length*(i+1)/k)]/step)*step))].filter(b=>b>mn&&b<=mx);if(!br.length)return[];
  const e=[0,...br,Infinity];return e.slice(0,-1).map((lo,i)=>{const hi=e[i+1]-1,n=pr.filter(x=>x>=lo&&x<=hi).length;
    return{lo:lo?String(lo):'',hi:hi===Infinity?'':String(hi),n,label:!lo?'Under '+pkr(e[1]):hi===Infinity?pkr(lo)+'+':pkr(lo)+' – '+pkr(hi)}}).filter(b=>b.n)}

/* ---- cart ---- */
let cart={};try{const c=JSON.parse(ld('wf-cart')||ld('of-cart')||'{}')||{};for(const k in c){const q=Math.floor(+c[k]);if(MAP.has(k)&&q>0)cart[k]=Math.min(q,99)}}catch(e){}
const cnt=()=>Object.values(cart).reduce((a,b)=>a+b,0),rowsOf=()=>Object.entries(cart).map(([id,q])=>[MAP.get(id),q]).filter(r=>r[0]),okRows=()=>rowsOf().filter(r=>r[0].stock!=='out');
const sum=rows=>rows.reduce((a,[p,q])=>a+p.price*q,0);
const save=()=>{sv('wf-cart',JSON.stringify(cart));$('#cnt').textContent=cnt()};
const waLink=items=>'https://wa.me/'+WA+'?text='+encodeURIComponent('Hello Watch Flex! I would like to place an order:\n\n'+items.map(([p,q],i)=>`${i+1}. ${p.name}${p.model?' ('+p.model+')':''} x${q} - ${pkr(p.price*q)}`).join('\n')+`\n\nTotal: ${pkr(sum(items))}\n\nPlease confirm availability and delivery details.`);
const TC={black:'#000000',cream:'#ece5dc',navy:'#ece5dc'};
function theme(t){if(!TC[t])t='black';document.documentElement.dataset.theme=t;sv('of-theme',t);$('meta[name=theme-color]').content=TC[t];$$a('.dot').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===t)))}
theme(ld('of-theme')==='red'?'navy':ld('of-theme')||'black');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const L=!!(window.gsap&&window.ScrollTrigger&&window.Lenis);

/* ---- templates ---- */
const imgBox=(p,ar='4/5')=>`<div class="im" role="img" aria-label="${esc(p.name)}" style="--ar:${ar}"><img src="${p.images[0]||PHW}" alt="" draggable="false" onerror="this.onerror=null;this.src=PHW"></div>`;
const wm=t=>`<h1 class="wm"><span class="fit"><span class="ch">${t}</span></span>${t==='WATCH FLEX'?'<sup aria-hidden="true">R</sup>':''}</h1>`;
const mark=()=>`<div class="rule"></div><div class="info"><span>WATCH FLEX PK</span><span class="w">WHY WATCH FLEX</span><a class="v" href="${IG}" target="_blank" rel="noopener">INSTAGRAM</a><span class="y">© 2026</span><p>Cash on delivery all over Pakistan. Delivery in 3–5 days. Order on WhatsApp.</p><a class="sr" href="#shipping">SHIPPING &amp; RETURNS</a></div>`;
const card=p=>{const out=p.stock==='out',img=p.images[0],tag=out?'Out of stock':p.featured?'Featured':p.isNew?'New':'',h='#p-'+esc(p.id);
  return `<article class="pc"><a class="pimg" href="${h}" aria-label="${esc(p.name)}"><img src="${img?sm(img):PHW}" alt="${esc(p.name)}" loading="lazy" decoding="async" draggable="false" onerror="this.onerror=null;this.src=PHW">${tag?`<span class="badge">${tag}</span>`:''}</a><div class="pm"><a class="pn" href="${h}">${esc(p.name)}</a><span class="pp">${pkr(p.price)}</span></div>${p.specs.length?`<div class="ps">${esc(p.specs.join(' | '))}</div>`:''}<div class="pa">${out?'<button class="cta" disabled>Out of stock</button>':`<button class="cta" data-a="add" data-id="${esc(p.id)}">Add to cart</button><a class="wab" href="${waLink([[p,1]])}" target="_blank" rel="noopener" aria-label="Order ${esc(p.name)} on WhatsApp">${WAI}</a>`}</div></article>`};
const catUI=()=>`<section class="sec" id="shopgrid"><div class="sh"><div><div class="eyebrow">The collection</div><h2>Shop Watches</h2></div><p class="rc" id="rc" role="status" aria-live="polite"></p></div>
<div class="tb"><label class="vh" for="q">Search watches</label><input id="q" type="search" placeholder="Search name, brand, model or spec" autocomplete="off"><label class="vh" for="so">Sort by</label><select id="so"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="name">Name: A to Z</option></select><button class="chip tgl" id="ft" aria-expanded="false" aria-controls="fpnl">Filters</button></div>
<div class="fpnl" id="fpnl"><div class="fg"><b>Brand</b><div class="chips bs" id="bc"></div></div><div class="fg"><b>Price (PKR)</b><div class="pr"><label class="vh" for="mn">Minimum price</label><input id="mn" type="number" min="0" step="500" inputmode="numeric" placeholder="Min"><span>–</span><label class="vh" for="mx">Maximum price</label><input id="mx" type="number" min="0" step="500" inputmode="numeric" placeholder="Max"></div><small id="pn"></small></div><div class="fg" id="bdg"><b>Shop by budget</b><div class="chips" id="bd"></div></div><button class="chip" id="cl" data-clear hidden>Clear filters</button></div>
<div class="pgrid" id="pgrid"></div><div class="em" id="em" hidden></div><div class="more"><button class="btn" id="lm" hidden>Load more</button></div></section>`;
const why=()=>`<section class="why"><div class="eyebrow">Why Watch Flex</div><h2>More Than Just a Watch</h2><div class="wg">${[[ico.q,'Premium Quality','Carefully selected watches'],[ico.c,'Cash on Delivery','All over Pakistan'],[ico.d,'Fast Delivery','3–5 days delivery time'],[ico.s,'Dedicated Support','We’re here to help on WhatsApp']].map(w=>`<div class="wi fx">${w[0]}<b>${w[1]}</b><span>${w[2]}</span></div>`).join('')}</div></section>`;
const revs=()=>REV.length?`<section class="sec"><div class="sh c"><div><div class="eyebrow">Customer reviews</div><h2>What Our Customers Say</h2></div></div><div class="revs">${REV.map(r=>`<div class="rev fx"><div class="stars" aria-label="5 out of 5 stars">★★★★★</div><p>“${esc(r[2])}”</p><div class="who"><span class="av">${esc(r[0][0])}</span><span><b>${esc(r[0])}</b><br><em>${esc(r[1])}</em></span></div></div>`).join('')}</div></section>`:'';

  return `<section class="pd"><div class="gal">${imgBox(p)}${p.images.length>1?`<div class="th">${p.images.map((u,i)=>`<button data-img="${esc(u)}" aria-label="Show photo ${i+1}"><img src="${esc(u)}" alt=""></button>`).join('')}</div>`:''}</div><div class="inf"><a href="#shop">← Back to shop</a><h1>${esc(p.name)}</h1><div class="price">${pkr(p.price)}</div>${dl.length?`<dl>${dl.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>`:''}${p.specs.length?`<ul class="sp">${p.specs.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}<div class="st">${out?'Out of stock':p.stock==='in'?'In stock':'Availability confirmed on WhatsApp'}</div>${out?'':`<button class="btn" data-a="add" data-id="${esc(p.id)}">Add to bag</button><a class="btn" href="${waLink([[p,1]])}" target="_blank" rel="noopener">Order on WhatsApp</a><a class="btn" id="goBag" href="#bag" hidden>Go to bag</a>`}</div></section>`};
const bag=()=>{const rows=rowsOf(),ok=okRows();
  return `<div class="bw">${wm('YOUR BAG')}<div class="rule"></div>`+(rows.length?'':`<img class="pal" src="${DECOR}" alt="" draggable="false" onerror="this.remove()"><p class="sub"><span class="fit">No watch yet?<br>Time is ticking.</span></p>`)+`</div>`+(rows.length?`<div class="lines">${rows.map(([p,q])=>`<div class="ln2">${imgBox(p)}<div><a href="#p-${esc(p.id)}">${esc(p.name)}</a>${p.stock==='out'?'<br><small>Currently unavailable. Remove it to order.</small>':''}</div><div class="q"><button data-a="dec" data-id="${esc(p.id)}" aria-label="Fewer ${esc(p.name)}">−</button><span aria-label="Quantity">${q}</span><button data-a="inc" data-id="${esc(p.id)}" aria-label="More ${esc(p.name)}">+</button></div><div class="lp">${pkr(p.price*q)} <button class="rm btn" data-a="rm" data-id="${esc(p.id)}" aria-label="Remove ${esc(p.name)}">Remove</button></div></div>`).join('')}</div><div class="sumr"><span>Subtotal ${pkr(sum(ok))}<br><small>Delivery and availability are confirmed on WhatsApp.</small></span><span><a class="btn" href="#shop">Back to shop</a>${ok.length?` <a class="btn" href="${waLink(ok)}" target="_blank" rel="noopener">Order on WhatsApp</a>`:''}</span></div>`:`<div class="pg"><a class="btn" href="#shop">Back to shop</a></div>`)};
const info=(t,body)=>`<section class="pg"><h1>${t}</h1>${body}<a class="btn" href="#shop">Back to shop</a></section>`;
const SHIP='<p>Cash on delivery all over Pakistan. Delivery time: 3–5 days. Confirm availability and delivery details with us on WhatsApp before you order.</p>',PRIV='<p>This website keeps your bag on your own device only. When you order, the message you send on WhatsApp is how we receive your details.</p>';
const foot=()=>`<footer><div class="ln"></div><div class="fh"><p class="big">Your Style. Your Time.<br><span>Your Flex.</span></p><div class="c26" aria-hidden="true">©26</div></div><p class="fp">Cash on delivery all over Pakistan. Delivery in 3–5 days.</p><div class="ln1"></div><div class="fc"><div><b>Watch Flex PK</b>Your Style. Your Time. Your Flex.<br>All rights reserved © 2026</div><div><b>Quick links</b><a href="#shop">Shop</a><a href="#bag">Bag</a></div><div><b>Customer care</b><a href="#shipping">Shipping &amp; returns</a><a href="#privacy">Privacy policy</a><a href="https://wa.me/${WA}" target="_blank" rel="noopener">Contact on WhatsApp</a></div><div><b>Follow us</b><a href="${IG}" target="_blank" rel="noopener">Instagram</a><a href="https://wa.me/${WA}" target="_blank" rel="noopener">WhatsApp</a></div></div></footer>`;
// fit a headline to its container; the ® badge scales with the text (.2em reserved)
function fitAll(){$$a('.fit').forEach(el=>{const h=el.parentElement,r=h.querySelector('sup')?.2:0;h.style.fontSize='100px';const w=el.getBoundingClientRect().width,a=h.clientWidth;if(w&&a)h.style.fontSize=(a/(w/100+r))+'px'})}

/* ---- catalogue behaviour ---- */
function initCat(){const br={};ITEMS.forEach(p=>p.brand&&(br[p.brand]=(br[p.brand]||0)+1));
  $('#bc').innerHTML=Object.keys(br).sort((a,b)=>a.localeCompare(b)).map(b=>`<button class="chip" data-brand="${esc(b)}" aria-pressed="false">${esc(b)} (${br[b]})</button>`).join('')||'<small>No brands yet</small>';
  const bd=budgets();$('#bd').innerHTML=bd.map(b=>`<button class="chip" data-lo="${b.lo}" data-hi="${b.hi}" aria-pressed="false">${b.label} (${b.n})</button>`).join('');$('#bdg').hidden=!bd.length;
  $('#q').value=S.q;$('#mn').value=S.min;$('#mx').value=S.max;$('#so').value=S.sort;cat()}
function cat(more){const g=$('#pgrid');if(!g)return;const r=view(),n=Math.min(S.shown,r.length);
  if(more)g.insertAdjacentHTML('beforeend',r.slice(g.children.length,n).map(card).join(''));else g.innerHTML=r.slice(0,n).map(card).join('');
  const act=!!(S.q.trim()||S.brands.size||S.min!==''||S.max==='0'||S.max!=='');
  $('#rc').textContent=!ITEMS.length?'':r.length?`Showing ${n} of ${r.length} watch${r.length>1?'es':''}`+(act?` (${ITEMS.length} in catalogue)`:''):'No watches match';
  const lm=$('#lm');lm.hidden=n>=r.length;lm.textContent=`Load more (${r.length-n} remaining)`;
  const em=$('#em');em.hidden=!!r.length;
  if(!r.length){const f=[S.q.trim()&&`“${esc(S.q.trim())}”`,S.brands.size&&[...S.brands].map(esc).join(', '),(S.min!==''||S.max!=='')&&`${S.min!==''?pkr(+S.min):'any price'} to ${S.max!==''?pkr(+S.max):'any price'}`].filter(Boolean).join(' · ');
    em.innerHTML=ITEMS.length?`<b>No watches found</b><p>Nothing matches ${f||'these filters'}. Try fewer words, another brand or a wider price range.</p><button class="btn" data-clear>Clear filters</button> <a class="btn" href="https://wa.me/${WA}" target="_blank" rel="noopener">Ask us on WhatsApp</a>`:`<b>New watches are on the way</b><p>Message us on WhatsApp for what is available now.</p><a class="btn" href="https://wa.me/${WA}" target="_blank" rel="noopener">Message on WhatsApp</a>`}
  $('#cl').hidden=!(act||S.sort!=='featured');
  const bad=S.min!==''&&S.max!==''&&+S.min>+S.max;$('#pn').textContent=bad?`Minimum is higher than maximum, so showing ${pkr(+S.max)} to ${pkr(+S.min)}.`:'';
  $$a('[data-brand]').forEach(c=>c.setAttribute('aria-pressed',String(S.brands.has(c.dataset.brand))));
  $$a('[data-lo]').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.lo===S.min&&c.dataset.hi===S.max)))}
let dt;const upd=()=>{S.shown=STEP;cat()},dq=()=>{clearTimeout(dt);dt=setTimeout(upd,160)};
addEventListener('input',e=>{const t=e.target;if(t.id==='q'){S.q=t.value;dq()}else if(t.id==='mn'||t.id==='mx'){S[t.id==='mn'?'min':'max']=t.value;dq()}});
addEventListener('change',e=>{if(e.target.id==='so'){S.sort=e.target.value;upd()}});

/* ---- smooth scroll (Lenis) + GSAP, only if the libraries loaded ---- */
let lenis=null,pal=null,fxIO=null;
if(L){gsap.registerPlugin(ScrollTrigger);lenis=new Lenis({duration:1.25,easing:t=>Math.min(1,1.001-Math.pow(2,-10*t)),smoothWheel:true});
lenis.on('scroll',ScrollTrigger.update);gsap.ticker.add(t=>lenis.raf(t*1000));gsap.ticker.lagSmoothing(0)}
function anim(first,still){
  if(fxIO)fxIO.disconnect();const fx=$$a('.fx');
  if(RM||!('IntersectionObserver' in window)){fx.forEach(e=>e.classList.add('in'))}
  else{fxIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');fxIO.unobserve(e.target)}}),{rootMargin:'0px 0px -5% 0px'});fx.forEach(e=>fxIO.observe(e));setTimeout(()=>fx.forEach(e=>e.classList.add('in')),3500)}
  if(!L)return;
  ScrollTrigger.getAll().forEach(s=>s.kill());if(pal){pal.kill();pal=null}
  if(!RM){
    $$a('.pd .im > img').forEach(img=>gsap.fromTo(img,{yPercent:-5},{yPercent:5,ease:'none',scrollTrigger:{trigger:img.parentElement,start:'top bottom',end:'bottom top',scrub:true}}));
    if(!still){
      gsap.from('.rule',{scaleX:0,duration:1.2,ease:'power4.inOut'});
      gsap.from('.wm .ch',{yPercent:112,duration:1.2,ease:'power4.out',delay:first?0:.05});
      gsap.from('.sub .fit',{yPercent:30,opacity:0,duration:.9,ease:'power3.out',delay:.3})}
    gsap.from('.big,.c26',{yPercent:20,opacity:0,duration:1,ease:'power3.out',scrollTrigger:{trigger:'footer',start:'top 90%',once:true}});
    const pe=$('.pal');if(pe){const W=Math.max(0,pe.parentElement.clientWidth-pe.offsetWidth),tl=gsap.timeline({repeat:-1,yoyo:true});
      tl.fromTo(pe,{x:W*.04,y:0,rotate:-6},{x:W*.48,y:W*.1,rotate:6,duration:7,ease:'sine.inOut'}).to(pe,{x:W*.96,y:W*.02,rotate:-4,duration:7,ease:'sine.inOut'});pal=tl}
  }
  ScrollTrigger.refresh()}
function route(keep,first,still){const h=decodeURIComponent(location.hash.slice(1)||'shop'),isP=h.startsWith('p-'),p=isP&&MAP.get(h.slice(2));
  $('#app').innerHTML=(h==='bag'?bag():p?prod(p):isP?info('Watch not found','<p>This watch is no longer listed or the link is wrong.</p>'):h==='shipping'?info('Shipping &amp; returns',SHIP):h==='privacy'?info('Privacy policy',PRIV):shop())+foot();
  document.title=p?p.name+' – Watch Flex PK':h==='bag'?'Bag – Watch Flex PK':'WATCH FLEX PK';
  $$a('nav a').forEach(a=>a.dataset.k===(h==='bag'?'bag':'shop')?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  if(keep!==true){lenis?lenis.scrollTo(0,{immediate:true,force:true}):scrollTo(0,0)}
  fitAll();if($('#pgrid'))initCat();anim(first,still);
  if(!first&&keep!==true){const t=$('#app h1');if(t){t.tabIndex=-1;t.focus({preventScroll:true})}}}

/* page transition: panel wipes up, swaps the page, keeps going */
let busy=false;
function go(h){const cur='#'+(location.hash.slice(1)||'shop');
  if(busy)return;if(cur===h){lenis?lenis.scrollTo(0):scrollTo({top:0,behavior:'smooth'});return}
  if(!L||RM){location.hash=h;return}busy=true;lenis.stop();
  gsap.timeline({onComplete:()=>{busy=false;lenis.start()}}).set('#tr',{yPercent:100}).to('#tr',{yPercent:0,duration:.7,ease:'power4.inOut'})
   .add(()=>{location.hash=h}).to('#tr',{yPercent:-100,duration:.7,ease:'power4.inOut',delay:.15})}
document.addEventListener('click',e=>{const T=e.target,d=T.closest('.dot');if(d)return theme(d.dataset.t);
  const br=T.closest('[data-brand]');if(br){const b=br.dataset.brand;S.brands.has(b)?S.brands.delete(b):S.brands.add(b);return upd()}
  const bg=T.closest('[data-lo]');if(bg){const same=S.min===bg.dataset.lo&&S.max===bg.dataset.hi;S.min=same?'':bg.dataset.lo;S.max=same?'':bg.dataset.hi;$('#mn').value=S.min;$('#mx').value=S.max;return upd()}
  if(T.closest('[data-clear]')){S.q='';S.brands.clear();S.min=S.max='';S.sort='featured';$('#q').value='';$('#mn').value='';$('#mx').value='';$('#so').value='featured';return upd()}
  if(T.closest('#ft')){const f=$('#fpnl'),o=f.classList.toggle('open');$('#ft').setAttribute('aria-expanded',String(o));return}
  if(T.closest('#lm')){S.shown+=STEP;cat(true);return}
  const th=T.closest('[data-img]');if(th){const i=$('.pd .im img');if(i)i.src=th.dataset.img;return}
  const a=T.closest('a[href^="#"]');if(a&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey){e.preventDefault();return go(a.getAttribute('href'))}
  const b=T.closest('[data-a]');if(!b)return;const k=b.dataset.a,id=b.dataset.id,p=MAP.get(id);if(!p)return;
  if(k==='add'){if(p.stock==='out')return;cart[id]=Math.min(99,(cart[id]||0)+1);save();say(`${p.name} added. ${cnt()} in your bag.`);
    if(b.classList.contains('cta')){b.textContent='Added ✓';setTimeout(()=>{if(b.isConnected)b.textContent='Add to cart'},1500)}else{b.textContent='Added — add another';const g=$('#goBag');if(g)g.hidden=false}return}
  if(k==='inc'&&cart[id]<99)cart[id]++;if(k==='dec'&&--cart[id]<1)delete cart[id];if(k==='rm')delete cart[id];
  save();route(true,false,true)});
addEventListener('hashchange',()=>route());
let lw=innerWidth;addEventListener('resize',()=>{if(innerWidth===lw)return;lw=innerWidth;requestAnimationFrame(()=>{fitAll();L&&ScrollTrigger.refresh()})});
/* dot cursor (mouse only, hidden until the mouse moves) */
if(L&&matchMedia('(hover:hover) and (pointer:fine)').matches){const c=$('#cur'),cx=gsap.quickTo(c,'x',{duration:.18,ease:'power3'}),cy=gsap.quickTo(c,'y',{duration:.18,ease:'power3'});addEventListener('mousemove',e=>{c.style.opacity=1;cx(e.clientX);cy(e.clientY)})}
/* intro: once per session; click or any key skips */
function intro(){const it=$('#intro'),IMS=ITEMS.map(p=>p.images[0]).filter(Boolean);
  lenis.stop();try{sessionStorage.setItem('wf-i','1')}catch(e){}
  $('#iw').innerHTML=[...'WATCH FLEX'].map(c=>`<span class="ch">${c===' '?'&nbsp;':c}</span>`).join('')+'<sup>®</sup>';
  const cards=$('#cards'),o={n:0};let made=0;
  const add=()=>{const m=new Image();m.src=IMS[made%IMS.length];cards.appendChild(m);made++;m.onerror=()=>m.remove();
    gsap.fromTo(m,{scale:.55,opacity:0,rotate:gsap.utils.random(-18,18),y:30},{scale:1,opacity:1,rotate:gsap.utils.random(-9,9),y:0,duration:.45,ease:'back.out(1.6)'})};
  gsap.set('.iw .ch',{yPercent:115});
  const tl=gsap.timeline({onComplete:()=>{document.documentElement.classList.remove('intro');it.remove();lenis.start()}});
  tl.to('.iw .ch',{yPercent:0,duration:.9,ease:'power4.out',stagger:.07})
    .to(o,{n:100,duration:2.2,ease:'power2.inOut',onUpdate:()=>{const n=Math.round(o.n);$('#ic').textContent=String(n).padStart(3,'0');while(IMS.length&&made<Math.min(10,Math.floor(n/9)+1))add()}},0)
    .to('#cards img',{y:-60,opacity:0,rotate:'+=8',duration:.5,ease:'power3.in',stagger:.03},'>+.1')
    .to('.iw .ch',{yPercent:-115,duration:.6,ease:'power3.in',stagger:.04},'<')
    .to('#intro',{yPercent:-100,duration:1,ease:'power4.inOut'},'>-.05')
    .add(()=>route(true,true),'<+.15');
  const skip=()=>{removeEventListener('keydown',skip);tl.progress(1)};it.addEventListener('click',skip);addEventListener('keydown',skip)}
save();
const start=()=>{if(L&&!RM&&document.documentElement.classList.contains('intro')){scrollTo(0,0);intro()}else{document.documentElement.classList.remove('intro');route(true,true);const i=$('#intro');i&&i.remove()}};
let started=false;const once=()=>{if(!started){started=true;start()}};
(document.fonts?document.fonts.ready:Promise.resolve()).then(once);setTimeout(once,2500);
if(document.fonts)document.fonts.ready.then(()=>{if(started)fitAll()});
</script></body></html>
