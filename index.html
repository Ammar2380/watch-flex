let busy=false,skipUntil=0;
const endTr=()=>{busy=false;lenis&&lenis.start();gsap.set('#tr',{visibility:'hidden',yPercent:100})};
function go(h){const cur=location.hash.slice(1)||'shop';
  if(cur==='shop')shopY=scrollY;
  if(busy)return;if('#'+cur===h){lenis?lenis.scrollTo(0):scrollTo({top:0,behavior:'smooth'});return}
  if(!L||RM){location.hash=h;return}
  busy=true;lenis.stop();
  gsap.timeline({onComplete:endTr,onInterrupt:endTr})
   .set('#tr',{yPercent:100,visibility:'visible'})
   .to('#tr',{yPercent:0,duration:.35,ease:'power2.inOut'})
   .add(()=>{skipUntil=performance.now()+500;location.hash=h;route(false,false,true)})
   .to('#tr',{yPercent:-100,duration:.35,ease:'power2.inOut',delay:.06})}
document.addEventListener('click',e=>{const T=e.target,d=T.closest('.dot');if(d)return theme(d.dataset.t);
  if(T.closest('.skip')){e.preventDefault();$('#app').focus();return}
  if(T.closest('#wc'))refreshWA();
  const br=T.closest('[data-brand]');if(br){const b=br.dataset.brand;S.brands.has(b)?S.brands.delete(b):S.brands.add(b);return upd()}
  const bg=T.closest('[data-lo]');if(bg){const same=S.min===bg.dataset.lo&&S.max===bg.dataset.hi;S.min=same?'':bg.dataset.lo;S.max=same?'':bg.dataset.hi;$('#mn').value=S.min;$('#mx').value=S.max;return upd()}
  if(T.closest('[data-clear]')){S.q='';S.brands.clear();S.min=S.max='';S.sort='featured';$('#q').value='';$('#mn').value='';$('#mx').value='';$('#so').value='featured';return upd()}
  if(T.closest('#ft')){const f=$('#fpnl'),o=f.classList.toggle('open');$('#ft').setAttribute('aria-expanded',String(o));return}
  if(T.closest('#lm')){S.shown+=STEP;cat(true);return}
  const th=T.closest('[data-img]');if(th){const i=$('.pd .im img');if(i)i.src=th.dataset.img;return}
  const a=T.closest('a[href^="#"]');if(a&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey){e.preventDefault();return go(a.getAttribute('href'))}
  const b=T.closest('[data-a]');if(!b)return;const k=b.dataset.a,id=b.dataset.id,p=MAP.get(id);if(!p)return;
  if(k==='add'){if(p.stock==='out')return;cart[id]=Math.min(99,(cart[id]||0)+1);save();say(`${p.name} added. ${cnt()} in your bag.`);
    if(b.classList.contains('cta')){b.textContent='Added ✓';setTimeout(()=>{if(b.isConnected)b.textContent='Add to cart'},1500)}else{b.textContent='Added — add another';const g=$('#goBag');if(g)g.hidden=false}return}
  if(k==='inc'&&cart[id]<99)cart[id]++;if(k==='dec'&&--cart[id]<1)delete cart[id];if(k==='rm')delete cart[id];
  save();route(true,false,true)});
addEventListener('hashchange',()=>{if(performance.now()>=skipUntil)route()});
let lw=innerWidth;addEventListener('resize',()=>{if(innerWidth===lw)return;lw=innerWidth;requestAnimationFrame(()=>{fitAll();L&&ScrollTrigger.refresh()})});
/* dot cursor (mouse only, hidden until the mouse moves) */
if(L&&matchMedia('(hover:hover) and (pointer:fine)').matches){const c=$('#cur'),cx=gsap.quickTo(c,'x',{duration:.18,ease:'power3'}),cy=gsap.quickTo(c,'y',{duration:.18,ease:'power3'});addEventListener('mousemove',e=>{c.style.opacity=1;cx(e.clientX);cy(e.clientY)})}
save();
// marquee in the navbar (text repeated so it always fills the width)
{const G='<div class="g">'+(('<span>'+MARQUEE.join('</span><span>')+'</span>').repeat(3))+'</div>';$('#mqt').innerHTML=G+G.replace('class="g"','class="g" aria-hidden="true"')}
route(true,true);                       // no intro: the page renders straight away
if(document.fonts)document.fonts.ready.then(fitAll);   // re-fit the wordmark once the web font arrives
</script></body></html>
