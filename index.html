<style>

html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}.lenis.lenis-stopped{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:500 clamp(11px,1vw,20px)/1.2 "Inter Tight","Helvetica Neue",Arial,sans-serif;overflow-x:hidden;transition:background .45s,color .45s}

.mk{display:flex;gap:.28vw;font-size:max(14px,1.35vw)}

.rt{display:flex;align-items:center;gap:2.4vw}

.dots{display:flex;gap:.45vw}
.dot{position:relative;width:max(14px,1.4vw);aspect-ratio:1;border-radius:50%;border:1px solid var(--fg);padding:0;cursor:pointer}

.wm{position:relative;margin:0 var(--pad);font:800 100px/.8 "Inter Tight",Arial,sans-serif;letter-spacing:-.04em;text-transform:uppercase}
.fit{display:inline-block;white-space:nowrap}

.ch{display:inline-block;will-change:transform}

.info{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--pad);row-gap:.9vw;padding:1.4vw var(--pad) 8vw;font-weight:600;text-transform:uppercase;font-size:clamp(10px,.85vw,18px)}
.info .w{grid-column:4/9}.info .v{grid-column:10/12}.info .y{grid-column:12;text-align:right}

.shop{padding-bottom:6vw}
.row{position:relative;height:calc(var(--rh)*1vw + 5vw);margin-bottom:11vw}
.tile{position:absolute;top:0;left:calc(var(--l)*1%);width:calc(var(--w)*1%);display:block}
.im{position:relative;overflow:hidden;cursor:pointer;aspect-ratio:var(--ar);background:#cdcdcb}
.im img{position:absolute;left:0;top:-8%;width:100%;height:116%;object-fit:cover;display:block;will-change:transform}

.meta{display:flex;justify-content:space-between;gap:.6vw;margin-top:.6vw;font-size:clamp(10px,.98vw,20px)}

.ln{height:2px;background:currentColor;margin-bottom:.8vw}
.fh{display:flex;justify-content:space-between;align-items:flex-start}

<body>

  gsap.set('.iw .ch',{yPercent:115});
  const tl=gsap.timeline({onComplete:()=>{it.remove();lenis.start();done&&done()}});
  tl.to('.iw .ch',{yPercent:0,duration:.9,ease:'power4.out',stagger:.07})
    .to(o,{n:100,duration:2.6,ease:'power2.inOut',onUpdate:()=>{const n=Math.round(o.n);$('#ic').textContent=String(n).padStart(3,'0');while(made<Math.min(10,Math.floor(n/9)+1))add()}},0)
    .to('#cards img',{y:-60,opacity:0,rotate:'+=8',duration:.5,ease:'power3.in',stagger:.03},'>+.1')
    .to('.iw .ch',{yPercent:-115,duration:.6,ease:'power3.in',stagger:.04},'<')
    .to('#intro',{yPercent:-100,duration:1,ease:'power4.inOut'},'>-.05')
    .add(()=>route(true,true),'<+.15');
}
save();
// render page once fonts are ready so the wordmark fits correctly
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{if(RM){route(false,true);$('#intro')&&$('#intro').remove()}else{window.scrollTo(0,0);intro()}});
</script></body></html>
